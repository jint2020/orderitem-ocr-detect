services:
  ocr:
    build:
      context: .
      args:
        # 国内构建加速，见 .env.example；留空则走官方源。
        APT_MIRROR_HOST: ${APT_MIRROR_HOST:-}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
        PYPI_FILES_BASE: ${PYPI_FILES_BASE:-}
    image: unicom-ocr-detect:latest
    platform: linux/amd64
    container_name: unicom-ocr
    ports:
      # 前面挂了 Nginx 等反向代理时，把 OCR_BIND_HOST 设为 127.0.0.1，
      # 容器端口就只对本机开放，不会绕过代理直接暴露到公网。
      - "${OCR_BIND_HOST:-0.0.0.0}:${OCR_PORT:-8080}:5000"
    environment:
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-2}
      GUNICORN_THREADS: ${GUNICORN_THREADS:-1}
      # 模型目录（容器内相对 /app）。默认值与 app/config.py 一致，可在 .env 覆盖。
      DETECTION_MODEL_DIR: ${DETECTION_MODEL_DIR:-models/PP-OCRv6_small_det_infer}
      RECOGNITION_MODEL_DIR: ${RECOGNITION_MODEL_DIR:-models/PP-OCRv6_medium_rec}
      DOC_ORIENTATION_MODEL_DIR: ${DOC_ORIENTATION_MODEL_DIR:-models/PP-LCNet_x1_0_doc_ori}
      MAX_CONTENT_LENGTH: ${MAX_CONTENT_LENGTH:-20971520}
      # API Key 鉴权，逗号分隔可配多个。留空 = 不鉴权，公网部署务必设置。
      API_KEYS: ${API_KEYS:-}
      # oneDNN 与 PP-OCRv6 在 paddlepaddle 3.3.1 上不兼容，默认关闭。
      ENABLE_MKLDNN: ${ENABLE_MKLDNN:-false}
      # 关掉 PIR 新执行器可绕开上述 oneDNN bug，与 ENABLE_MKLDNN=true 配合使用。
      ENABLE_NEW_IR: ${ENABLE_NEW_IR:-true}
      # 推理后端：paddle（默认）或 onnxruntime。见 .env.example。
      INFERENCE_ENGINE: ${INFERENCE_ENGINE:-paddle}
      # 性能相关，见 .env.example。留空使用 app/config.py 的默认值。
      CPU_THREADS: ${CPU_THREADS:-}
      TEXT_DET_LIMIT_SIDE_LEN: ${TEXT_DET_LIMIT_SIDE_LEN:-}
      TEXT_DET_LIMIT_TYPE: ${TEXT_DET_LIMIT_TYPE:-}
    volumes:
      # 模型只读挂载；需先按 models/README.md 下载到本地 models/
      - ./models:/app/models:ro
    restart: unless-stopped
    healthcheck:
      test:
        - CMD-SHELL
        - "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/api/v1/openapi.json', timeout=5).read()\""
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
