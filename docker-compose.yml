services:
  ocr:
    build: .
    image: unicom-ocr-detect:latest
    platform: linux/amd64
    container_name: unicom-ocr
    ports:
      - "${OCR_PORT:-8080}:5000"
    environment:
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-2}
      # 模型目录（容器内相对 /app）。默认值与 app/config.py 一致，可在 .env 覆盖。
      DETECTION_MODEL_DIR: ${DETECTION_MODEL_DIR:-models/PP-OCRv6_small_det_infer}
      RECOGNITION_MODEL_DIR: ${RECOGNITION_MODEL_DIR:-models/PP-OCRv6_medium_rec}
      DOC_ORIENTATION_MODEL_DIR: ${DOC_ORIENTATION_MODEL_DIR:-models/PP-LCNet_x1_0_doc_ori}
      MAX_CONTENT_LENGTH: ${MAX_CONTENT_LENGTH:-20971520}
    volumes:
      # 模型只读挂载；需先按 models/README.md 下载到本地 models/
      - ./models:/app/models:ro
    restart: unless-stopped
    healthcheck:
      test:
        - CMD-SHELL
        - "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/api/v1/openapi.json', timeout=5).read()\""
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
